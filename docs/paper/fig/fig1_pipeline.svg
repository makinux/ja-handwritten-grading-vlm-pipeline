<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 300" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="13">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#333"/></marker>
  </defs>
  <style>.b{fill:#fff;stroke:#333;stroke-width:1.4;rx:6}.g{fill:#f2f2f2;stroke:#666;stroke-width:1;rx:4}.t{fill:#111}.s{font-size:11px;fill:#444}.a{stroke:#333;stroke-width:1.4;marker-end:url(#ar);fill:none}</style>

  <rect class="b" x="10" y="90" width="130" height="64" rx="6"/>
  <text class="t" x="75" y="116" text-anchor="middle">M1 解法生成</text>
  <text class="s" x="75" y="134" text-anchor="middle">実行可能ステップ列</text>

  <rect class="b" x="185" y="90" width="150" height="64" rx="6"/>
  <text class="t" x="260" y="110" text-anchor="middle">M2 誤り注入</text>
  <text class="s" x="260" y="128" text-anchor="middle">機械オペレータ</text>
  <text class="s" x="260" y="144" text-anchor="middle">+LLM 概念オペレータ</text>

  <rect class="b" x="380" y="90" width="170" height="64" rx="6"/>
  <text class="t" x="465" y="110" text-anchor="middle">逐語化(合成方式)</text>
  <text class="s" x="465" y="128" text-anchor="middle">LLM=説明句のみ</text>
  <text class="s" x="465" y="144" text-anchor="middle">式=テンプレート機械合成</text>

  <rect class="b" x="595" y="90" width="140" height="64" rx="6"/>
  <text class="t" x="665" y="116" text-anchor="middle">M3 レンダリング</text>
  <text class="s" x="665" y="134" text-anchor="middle">文字単位座標 GT</text>

  <rect class="b" x="780" y="70" width="150" height="104" rx="6"/>
  <text class="t" x="855" y="92" text-anchor="middle">教師データ</text>
  <text class="s" x="855" y="112" text-anchor="middle">答案画像+忠実転記</text>
  <text class="s" x="855" y="130" text-anchor="middle">誤り(位置・種別)</text>
  <text class="s" x="855" y="148" text-anchor="middle">点数(ルーブリック)</text>
  <text class="s" x="855" y="166" text-anchor="middle">対照ペア(誤りなし)</text>

  <line class="a" x1="140" y1="122" x2="183" y2="122"/>
  <line class="a" x1="335" y1="122" x2="378" y2="122"/>
  <line class="a" x1="550" y1="122" x2="593" y2="122"/>
  <line class="a" x1="735" y1="122" x2="778" y2="122"/>

  <rect class="g" x="30" y="196" width="120" height="34"/>
  <text class="s" x="90" y="217" text-anchor="middle">G1: 実行検証</text>
  <rect class="g" x="200" y="196" width="150" height="34"/>
  <text class="s" x="275" y="217" text-anchor="middle">G2: 差分封じ込め</text>
  <rect class="g" x="393" y="196" width="144" height="34"/>
  <text class="s" x="465" y="217" text-anchor="middle">G1b: 式包含=構成的 100%</text>
  <rect class="g" x="575" y="196" width="180" height="34"/>
  <text class="s" x="665" y="217" text-anchor="middle">AST ホワイトリスト検証(LLM 提案)</text>
  <line class="a" x1="90" y1="196" x2="82" y2="156" stroke-dasharray="4 3"/>
  <line class="a" x1="275" y1="196" x2="266" y2="156" stroke-dasharray="4 3"/>
  <line class="a" x1="465" y1="196" x2="465" y2="156" stroke-dasharray="4 3"/>
  <line class="a" x1="640" y1="196" x2="286" y2="152" stroke-dasharray="4 3"/>

  <rect class="g" x="240" y="250" width="460" height="34"/>
  <text class="s" x="470" y="271" text-anchor="middle">訓練前検証: 報酬敵対的テスト(逆転 0/1000)・text-only リークプローブ</text>

  <text class="s" x="10" y="30">図 1: label-by-construction 合成パイプライン。ラベルは注釈ではなく構成から導かれ、各段のゲートが正しさを保証する。</text>
</svg>
